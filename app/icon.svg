<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo arredondado azul da marca -->
  <rect width="100" height="100" rx="22" fill="#03295A"/>

  <!-- Pata esquerda externa -->
  <ellipse cx="20" cy="43" rx="9" ry="11"
    fill="#FE7501"
    transform="rotate(-25 20 43)"/>

  <!-- Pata esquerda interna -->
  <ellipse cx="37" cy="27" rx="9" ry="11"
    fill="#FE7501"
    transform="rotate(-8 37 27)"/>

  <!-- Pata direita interna -->
  <ellipse cx="56" cy="27" rx="9" ry="11"
    fill="#FE7501"
    transform="rotate(8 56 27)"/>

  <!-- Pata direita externa -->
  <ellipse cx="73" cy="42" rx="9" ry="11"
    fill="#FE7501"
    transform="rotate(25 73 42)"/>

  <!-- Almofada central (pad principal) -->
  <ellipse cx="46" cy="70" rx="24" ry="21" fill="#FE7501"/>
</svg>
